name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gvp_admin
          POSTGRES_PASSWORD: gvp_admin
          POSTGRES_DB: gvp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gvp_admin" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: gvp_admin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Create application database roles
        run: psql -h localhost -U gvp_admin -d gvp -v ON_ERROR_STOP=1 -f db/roles.sql
      - name: Lint
        run: uv run ruff check .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
      - name: Tests (real PostgreSQL, RLS, least-privilege roles)
        run: uv run pytest
      - name: Static analysis
        run: uv run bandit -q -r accounts tenancy audit platform_core members elections nominations keys electorate voting tally quorum config -c pyproject.toml
      - name: Dependency audit
        run: uv export --frozen --no-dev --no-hashes -o requirements.txt && uv run pip-audit -r requirements.txt --strict
