{% extends "base.html" %}
{% block title %}Reactivate {{ member.full_name }}{% endblock %}
{% block content %}
<h1>Reactivate {{ member.full_name }}?</h1>
<p>They will regain member access. This is recorded in the audit trail.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Reactivate member</button>
  <a href="{% url 'members:detail' org_slug=request.org.slug member_id=member.id %}">Cancel</a>
</form>
{% endblock %}
