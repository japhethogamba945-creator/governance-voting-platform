{% extends "base.html" %}
{% block title %}Verification code{% endblock %}
{% block content %}
<h1>Enter your code</h1>
<p>Open your authenticator app and enter the 6-digit code. You can also use one of your recovery codes.</p>
{% include "form_errors.html" %}
<form method="post" novalidate>
  {% csrf_token %}
  <label for="{{ form.token.id_for_label }}">Code</label>
  {{ form.token }}
  <button type="submit">Sign in</button>
</form>
{% endblock %}
